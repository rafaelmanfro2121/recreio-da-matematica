  :root {
    --paper: #fdf6e6;
    --paper-line: #cdd6e8;
    --margin: #e2685c;
    --ink: #2b2440;
    --ink-soft: #6b6280;
    --board: #1f6f5c;
    --board-dark: #16513f;
    --chalk: #fce8a6;
    --chalk-dim: #fce8a6cc;
    --sun: #ffb627;
    --coral: #ef5b4e;
    --leaf: #2fae66;
    --card: #fffdf7;
    --op-add: #2e6ff2;
    --op-subtract: #f2994a;
    --op-multiply: #e8478b;
    --op-divide: #8b5cf6;
    --shadow: 0 10px 0 0 rgba(43, 36, 64, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Nunito", ui-rounded, "Segoe UI", sans-serif;
    min-height: 100vh;
    background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 39px,
        var(--paper-line) 39px,
        var(--paper-line) 40px
      ),
      linear-gradient(to right, transparent 0 63px, var(--margin) 63px 64px, transparent 64px);
    background-position: 0 92px, 0 0;
    -webkit-text-size-adjust: 100%;
  }

  h1,
  h2,
  h3,
  .display {
    font-family: "Baloo 2", ui-rounded, sans-serif;
    text-wrap: balance;
  }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    color: inherit;
  }

  button:disabled {
    cursor: default;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--op-add);
    outline-offset: 2px;
  }

  a {
    color: inherit;
  }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px max(48px, env(safe-area-inset-bottom)) 84px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 420px) {
    .app-shell {
      padding-left: 76px;
      padding-right: 14px;
    }
    body {
      background-position: 0 92px, 0 0;
    }
  }

  header.top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 0 18px;
    padding-top: max(22px, env(safe-area-inset-top));
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 6px 4px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .back-btn:hover {
    color: var(--ink);
  }

  .brand {
    flex: 1;
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 0;
  }

  .brand-badge {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--board);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }

  .brand-badge svg {
    width: 18px;
    height: 18px;
  }

  .mute-btn {
    background: none;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    border-radius: 10px;
    flex-shrink: 0;
  }

  .mute-btn:hover {
    color: var(--ink);
  }

  .mute-btn svg {
    width: 18px;
    height: 18px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #main.view-enter {
    animation: view-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes view-in {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---------- Level map ---------- */

  .map-intro {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 14.5px;
    margin: 0 0 22px;
    line-height: 1.5;
  }

  .path {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-bottom: 8px;
  }

  .path::before {
    content: "";
    position: absolute;
    left: 30px;
    top: 30px;
    bottom: 30px;
    width: 0;
    border-left: 4px dashed var(--paper-line);
    z-index: 0;
  }

  .level-row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    text-align: left;
    background: none;
    padding: 0;
    width: 100%;
  }

  .badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    box-shadow: var(--shadow), 0 14px 28px -10px rgba(20, 15, 40, 0.35);
    border: 4px solid var(--card);
    transition: transform 0.15s ease;
  }

  .level-row:not(:disabled):hover .badge {
    transform: scale(1.05) rotate(-3deg);
  }

  .badge.locked {
    background: #e7e0cf;
    color: #b9ae94;
    box-shadow: none;
    border-color: #e7e0cf;
  }

  .badge svg {
    width: 28px;
    height: 28px;
  }

  .badge.locked svg {
    width: 24px;
    height: 24px;
  }

  .level-info {
    flex: 1;
    min-width: 0;
  }

  .level-card {
    border-radius: 16px;
    padding: 9px 13px;
    border: 2px solid var(--paper-line);
    background: var(--card);
    margin-top: 4px;
  }

  .level-row:not(:disabled) .level-card {
    border-color: transparent;
  }

  .level-title {
    font-family: "Baloo 2", sans-serif;
    font-size: 17px;
    font-weight: 800;
    margin: 0 0 2px;
  }

  .level-desc {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.35;
  }

  .stars {
    display: flex;
    gap: 3px;
    margin-top: 6px;
  }

  .stars svg {
    width: 16px;
    height: 16px;
  }

  .reset-link {
    margin-top: 30px;
    align-self: center;
    background: none;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .tabuada-entry {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    background: var(--card);
    border: 2px dashed #1f6f5c55;
    border-radius: 22px;
    padding: 14px;
    width: 100%;
  }

  .tabuada-entry:active {
    transform: scale(0.98);
  }

  .tabuada-entry-badge {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e7f3ef;
    color: #1f6f5c;
  }

  .tabuada-entry-badge svg {
    width: 26px;
    height: 26px;
  }

  /* ---------- Tabuada select ---------- */

  .tabuada-select-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 0 40px;
  }

  .tabuada-grid {
    width: 100%;
    max-width: 360px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .tabuada-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 20px;
    padding: 16px 10px;
    transition: transform 0.1s ease;
  }

  .tabuada-card:active {
    transform: scale(0.96);
  }

  .tabuada-num {
    font-family: "Baloo 2", sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: #1f6f5c;
  }

  .tabuada-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
  }

  .tabuada-time {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .tabuada-time svg {
    width: 12px;
    height: 12px;
  }

  /* ---------- Intro ---------- */

  .intro-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 0 60px;
  }

  .intro-badge {
    width: 116px;
    height: 116px;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", sans-serif;
    font-size: 56px;
    font-weight: 800;
    color: #fff;
    box-shadow: var(--shadow), 0 18px 34px -12px rgba(20, 15, 40, 0.4);
    transform: rotate(-4deg);
  }

  .intro-badge svg {
    width: 52px;
    height: 52px;
  }

  .intro-screen h1 {
    font-size: 30px;
    margin: 26px 0 6px;
  }

  .intro-screen p.desc {
    max-width: 260px;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 15px;
    margin: 0;
    line-height: 1.5;
  }

  .intro-meta {
    margin-top: 14px;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
  }

  .btn {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
    padding: 15px 34px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 9px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn svg {
    width: 19px;
    height: 19px;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 0 rgba(43, 36, 64, 0.12);
  }

  .btn.ghost {
    color: var(--ink-soft);
    background: var(--card);
    box-shadow: none;
    border: 2px solid var(--paper-line);
  }

  .btn.ghost:active {
    transform: translateY(2px);
  }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
    margin-top: 30px;
  }

  /* ---------- Playing ---------- */

  .play-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4px;
  }

  .ticks {
    display: flex;
    gap: 5px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 8px;
  }

  .ticks span {
    flex: 1;
    height: 7px;
    border-radius: 4px;
    background: var(--paper-line);
  }

  .ticks span.done {
    background: var(--sun);
  }

  .ticks span.current {
    background: var(--ink);
  }

  .q-count {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-soft);
    align-self: flex-start;
    margin: 0 0 6px 2px;
  }

  .slate {
    width: 100%;
    max-width: 340px;
    background: radial-gradient(120% 160% at 20% 0%, var(--board) 0%, var(--board-dark) 100%);
    border-radius: 24px;
    border: 6px solid #ecdcae;
    padding: 34px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .slate.wrong {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    10%,
    90% {
      transform: translateX(-3px);
    }
    20%,
    80% {
      transform: translateX(5px);
    }
    30%,
    50%,
    70% {
      transform: translateX(-8px);
    }
    40%,
    60% {
      transform: translateX(8px);
    }
  }

  .slate .num,
  .slate .sym,
  .slate .eq {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 46px;
    color: var(--chalk);
    font-variant-numeric: tabular-nums;
  }

  .slate .sym,
  .slate .eq {
    color: var(--chalk-dim);
    opacity: 0.75;
  }

  .slate .answer {
    min-width: 1.4ch;
    text-align: center;
    padding: 2px 8px;
    border-radius: 10px;
    border-bottom: 4px dashed var(--chalk-dim);
  }

  .slate .answer.filled {
    border-bottom-style: solid;
  }

  .feedback {
    max-width: 340px;
    text-align: center;
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin: 14px 0 0;
    min-height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .feedback svg {
    width: 18px;
    height: 18px;
  }

  .feedback.correct {
    color: var(--leaf);
  }

  .feedback.wrong {
    color: var(--coral);
  }

  .keypad {
    margin-top: 18px;
    width: 100%;
    max-width: 340px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .key {
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    padding: 16px 0;
    font-family: "Baloo 2", sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    box-shadow: 0 4px 0 0 var(--paper-line);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .key:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: none;
  }

  .key:disabled {
    opacity: 0.45;
  }

  .key.wide-icon svg {
    width: 20px;
    height: 20px;
  }

  .key.submit {
    background: var(--op-color, var(--op-add));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 0 0 rgba(43, 36, 64, 0.25);
  }

  .key.ghost-key {
    background: transparent;
    box-shadow: none;
    pointer-events: none;
  }

  .submit-btn-wide {
    width: 100%;
    max-width: 340px;
    margin-top: 14px;
    justify-content: center;
  }

  .submit-btn-wide:disabled {
    opacity: 0.4;
  }

  .slate.compact .num,
  .slate.compact .sym,
  .slate.compact .eq {
    font-size: 28px;
  }

  .slate.compact .answer {
    font-size: 28px;
  }

  /* ---------- Lesson ---------- */

  .lesson-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0 40px;
  }

  .lesson-title {
    font-size: 24px;
    margin: 0 0 4px;
    text-align: center;
  }

  .lesson-intro {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    margin: 0 0 18px;
    max-width: 300px;
  }

  .lesson-card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 2px solid;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .lesson-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .lesson-badge {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }

  .lesson-head h2 {
    font-size: 18px;
    margin: 0;
  }

  .lesson-text {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .lesson-kw-label {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin: 12px 0 6px;
  }

  .kw-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .kw-chip {
    background: var(--paper);
    border: 1.5px solid var(--paper-line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink);
  }

  .lesson-example {
    background: var(--paper);
    border-radius: 16px;
    padding: 12px 14px;
  }

  .lesson-example-text {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 0 10px;
  }

  .demo {
    margin: 8px 0;
    min-height: 20px;
  }

  .lesson-equation {
    font-family: "Baloo 2", sans-serif;
    font-size: 17px;
    font-weight: 800;
    margin: 8px 0 0;
  }

  .lesson-equation strong {
    color: var(--leaf);
  }

  .lesson-money {
    margin: 12px 0 0;
    font-size: 12.5px;
    font-weight: 700;
    color: #92650f;
    background: #fff6e0;
    border-radius: 12px;
    padding: 8px 12px;
  }

  .lesson-contrast {
    width: 100%;
    max-width: 360px;
    margin: 0 0 18px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #fdeae7;
    color: #a13a2a;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    text-align: left;
  }

  .dots-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.faded {
    opacity: 0.25;
  }

  .dots-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .dots-groups {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .dots-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px;
    border: 2px dashed var(--paper-line);
    border-radius: 10px;
    max-width: 74px;
  }

  /* ---------- Story / interpretation ---------- */

  .chat {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }

  .chat-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .chat-row.ask {
    flex-direction: row-reverse;
  }

  .mascot {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .mascot svg {
    width: 100%;
    height: 100%;
  }

  .bubble {
    position: relative;
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink);
  }

  .chat-row.ask .bubble {
    border-color: var(--sun);
    background: #fff6e0;
  }

  .bubble::before {
    content: "";
    position: absolute;
    top: 12px;
    width: 0;
    height: 0;
    border: 7px solid transparent;
  }

  .chat-row:not(.ask) .bubble::before {
    left: -12px;
    border-right-color: var(--card);
  }

  .chat-row.ask .bubble::before {
    right: -12px;
    border-left-color: #fff6e0;
  }

  .op-label {
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
    margin: 0 0 8px 2px;
    align-self: flex-start;
  }

  .op-choices {
    width: 100%;
    max-width: 340px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .op-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    padding: 14px 8px;
    min-height: 68px;
    transition: transform 0.1s ease;
  }

  .op-choice .op-sym {
    font-family: "Baloo 2", sans-serif;
    font-size: 25px;
    font-weight: 800;
    color: var(--ink-soft);
  }

  .op-choice .op-lbl {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
  }

  .op-choice:active:not(:disabled) {
    transform: scale(0.97);
  }

  .op-choice.correct-pick,
  .op-choice.correct-pick .op-sym,
  .op-choice.correct-pick .op-lbl {
    background: #e3f6ea;
    border-color: var(--leaf);
    color: var(--leaf);
  }

  .op-choice.wrong-pick {
    background: #fdeae7;
    border-color: var(--coral);
    animation: shake 0.4s ease;
  }

  .op-choice.wrong-pick .op-sym,
  .op-choice.wrong-pick .op-lbl {
    color: var(--coral);
  }

  .op-choice.reveal {
    border-color: var(--leaf);
    border-style: dashed;
    background: #f2fbf5;
  }

  .op-choice.reveal .op-sym,
  .op-choice.reveal .op-lbl {
    color: var(--leaf);
  }

  .op-choice:disabled:not(.correct-pick):not(.wrong-pick):not(.reveal) {
    opacity: 0.4;
  }

  .reason-box {
    max-width: 340px;
    text-align: center;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.5;
    margin: 14px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
  }

  .reason-box.correct {
    background: #e3f6ea;
    color: #1c7a44;
  }

  .reason-box.wrong {
    background: #fdeae7;
    color: #c23f2f;
  }

  .recap-story {
    max-width: 340px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 10px;
    line-height: 1.4;
  }

  .recap-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 14px;
  }

  /* ---------- Summary ---------- */

  .summary-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 0 60px;

  function generateWordProblem(operation) {
    const templates = TEMPLATES[operation];
    const built = pick(templates)();
    const key = operation + "|" + built.text + "|" + built.question;
    return Object.assign(
      { operation, key, aFormat: "count", bFormat: "count", answerFormat: "count" },
      built
    );
  }

  function balancedOps(ops, count) {
    const arr = [];
    for (let i = 0; i < count; i++) arr.push(ops[i % ops.length]);
    return shuffle(arr);
  }

  function generateRound(ops, usedKeys) {
    const seq = balancedOps(ops, QUESTIONS_PER_ROUND);
    const round = [];
    seq.forEach((op) => {
      let q = null;
      for (let i = 0; i < 40; i++) {
        const candidate = generateWordProblem(op);
        if (!usedKeys.has(candidate.key)) {
          q = candidate;
          break;
        }
      }
      if (!q) q = generateWordProblem(op);
      usedKeys.add(q.key);
      round.push(q);
    });
    return round;
  }

  function loadProgress() {

  function completeLevel(progress, levelId, correctCount, total) {
    const levelIndex = LEVELS.findIndex((l) => l.id === levelId);
    const stars = correctCount === total ? 3 : correctCount >= total * 0.7 ? 2 : correctCount > 0 ? 1 : 0;
    const nextUnlocked =
      correctCount === total ? Math.max(progress.unlockedLevelIndex, levelIndex + 1) : progress.unlockedLevelIndex;
    const prevStars = progress.stars[levelId] ?? 0;
    const updated = {
      unlockedLevelIndex: Math.min(nextUnlocked, LEVELS.length - 1),
      stars: Object.assign({}, progress.stars, { [levelId]: Math.max(prevStars, stars) }),
    };
    saveProgress(updated);
    return updated;
  }

  const TABUADA_KEY = "mathgame:tabuada:v1";

  // Retrieval practice in randomized (not sequential) order, with facts the
  // child has historically missed nudged earlier — spaced/weighted repetition
  // rather than a fixed 1x-10x recital, which is what actually builds recall.
  function buildTabuadaQueue(table, missCounts) {
    const facts = TABUADA_TABLES.map((m) => ({ table, m, answer: table * m }));
    return facts
      .map((f) => ({ f, sortKey: Math.random() - (missCounts[f.m] || 0) * 0.15 }))
      .sort((a, b) => a.sortKey - b.sortKey)
      .map((x) => x.f);
  }

  function formatElapsed(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes > 0 ? `${minutes}m ${String(seconds).padStart(2, "0")}s` : `${seconds}s`;
  }

  function getCtx() {
    if (muted) return null;
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freqs, duration, type) {
    const ctx = getCtx();
    if (!ctx) return;
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * duration;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration);
    });
  }

  const playCorrect = () => playTone([523.25, 659.25, 783.99], 0.12, "triangle");

  /* ============ Confetti ============ */
  const CONFETTI_COLORS = ["#ef5b4e", "#ffb627", "#2fae66", "#2e6ff2", "#e8478b", "#8b5cf6"];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function burstConfetti() {
    if (reduceMotion) return;
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    const width = (canvas.width = canvas.offsetWidth);
    const height = (canvas.height = canvas.offsetHeight);

    const pieces = Array.from({ length: 140 }, () => ({
      x: Math.random() * width,
      y: -20 - Math.random() * height * 0.5,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10,
      size: 6 + Math.random() * 6,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    }));

    let frame = 0;
    const maxFrames = 220;

    function draw() {
      ctx.clearRect(0, 0, width, height);
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.rotation += p.rotationSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      frame++;
      if (frame < maxFrames) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, width, height);
    }
    draw();
  }

    if (format === "money") {

      if (commaIdx === -1) {
        if (state.input.length >= 3) return;

  function beginTabuadaRound(table) {

      table,

      startTime: Date.now(),

    const t = state.tabuada;
    if (!t || t.feedback || t.finished || t.input.length === 0) return;
    const correct = Number(t.input) === t.currentFact.answer;
    t.feedback = correct ? "correct" : "wrong";

  function finishTabuadaRound() {
    const t = state.tabuada;
    t.finished = true;
    t.elapsedMs = Date.now() - t.startTime;
    const prog = tabuadaTableProgress(state.tabuadaProgress, t.table);
    const stars = t.misses === 0 ? 3 : t.misses <= 3 ? 2 : 1;
    let newRecord = false;
    if (t.misses === 0 && (prog.bestTimeMs === null || t.elapsedMs < prog.bestTimeMs)) {
      prog.bestTimeMs = t.elapsedMs;
      newRecord = true;
    }
    prog.stars = Math.max(prog.stars, stars);
    state.tabuadaProgress[t.table] = prog;
    saveTabuadaProgress(state.tabuadaProgress);
    t.newRecord = newRecord;
    t.starsEarned = stars;
    render();
    if (stars === 3) {
      playLevelUp();
      requestAnimationFrame(burstConfetti);

  function tabuadaContinue() {
    const t = state.tabuada;
    const fact = t.currentFact;
    const wasCorrect = t.feedback === "correct";
    t.queue.shift();

    if (wasCorrect) {
      t.clearedFacts.add(fact.m);
    } else {
      t.misses++;
      const prog = tabuadaTableProgress(state.tabuadaProgress, t.table);
      prog.missCounts[fact.m] = (prog.missCounts[fact.m] || 0) + 1;
      state.tabuadaProgress[t.table] = prog;
      saveTabuadaProgress(state.tabuadaProgress);
      const insertAt = Math.min(t.queue.length, randInt(TABUADA_REQUEUE_MIN, TABUADA_REQUEUE_MAX));
      t.queue.splice(insertAt, 0, fact);
    }

    t.input = "";
    t.feedback = null;

    if (t.clearedFacts.size >= TABUADA_TABLES.length) {
      finishTabuadaRound();
      return;
    }

    t.currentFact = nextTabuadaFact(t);
    render();
  }

  function render() {
    updateBackBtn();
    if (state.view === "map") renderMap();
    else if (state.view === "intro") renderIntro();
    else if (state.view === "lesson") renderLesson();
    else if (state.view === "quiz") renderQuiz();
    else if (state.view === "playing") renderPlaying();
    else if (state.view === "summary") renderSummary();
    else if (state.view === "tabuada-select") renderTabuadaSelect();
    else if (state.view === "tabuada-round") renderTabuadaRound();
    mainEl.classList.remove("view-enter");
    void mainEl.offsetWidth;
    mainEl.classList.add("view-enter");
  }

  function ticksHtml(total, completed) {
    let html = "";
    for (let i = 0; i < total; i++) {

      if (i < completed) cls = "done";
      else if (i === completed) cls = "current";
      html += `<span class="${cls}"></span>`;
    }
    return html;
  }

  function renderPlayingAnswer() {
    const slot = document.getElementById("answer-slot");
    if (!slot) return;
    const slate = document.getElementById("slate");
    const feedback = document.getElementById("feedback");
    const submitBtn = document.getElementById("submit-btn");
    const keys = document.querySelectorAll(".key[data-digit], #comma-btn, #backspace-btn");
    const continueRow = document.getElementById("continue-row");
    const q = currentQuestion();
    const meta = OPS_META[q.operation];
    const isMoney = q.answerFormat === "money";

    slot.textContent = state.input ? (isMoney ? "R$ " + state.input : state.input) : "?";
    slot.classList.toggle("filled", state.input.length > 0);

    keys.forEach((k) => (k.disabled = !!state.feedback));
    if (submitBtn) {
      submitBtn.disabled = !!state.feedback || !isInputValid(state.input, q.answerFormat);
      submitBtn.style.display = state.feedback ? "none" : "inline-flex";
    }

    if (state.feedback === "correct") {
      feedback.className = "feedback correct";
      feedback.innerHTML = `${ICONS.check} Isso mesmo! ${formatOperand(q.a, q.aFormat)} ${meta.symbol} ${formatOperand(q.b, q.bFormat)} = ${formatOperand(q.answer, q.answerFormat)}`;
      slate.classList.remove("wrong");
    } else if (state.feedback === "wrong") {
      feedback.className = "feedback wrong";
      feedback.innerHTML = `${ICONS.x} ${formatOperand(q.a, q.aFormat)} ${meta.symbol} ${formatOperand(q.b, q.bFormat)} = ${formatOperand(q.answer, q.answerFormat)}`;
      slate.classList.add("wrong");
    } else {
      feedback.className = "feedback";
      feedback.innerHTML = "";
      slate.classList.remove("wrong");
    }

    if (continueRow) continueRow.style.display = state.feedback ? "flex" : "none";
  }

  }

  function renderTabuadaAnswer() {
    const slot = document.getElementById("answer-slot");
    if (!slot) return;
    const t = state.tabuada;
    const slate = document.getElementById("slate");
    const feedback = document.getElementById("feedback");
    const submitBtn = document.getElementById("submit-btn");
    const keys = document.querySelectorAll("#keypad .key[data-digit], #backspace-btn");
    const continueRow = document.getElementById("continue-row");
    const fact = t.currentFact;

    slot.textContent = t.input || "?";
    slot.classList.toggle("filled", t.input.length > 0);

    keys.forEach((k) => (k.disabled = !!t.feedback));
    if (submitBtn) {
      submitBtn.disabled = !!t.feedback || t.input.length === 0;
      submitBtn.style.display = t.feedback ? "none" : "inline-flex";
    }

    if (t.feedback === "correct") {
      feedback.className = "feedback correct";
      feedback.innerHTML = `${ICONS.check} Isso mesmo! ${fact.table} × ${fact.m} = ${fact.answer}`;
      slate.classList.remove("wrong");
    } else if (t.feedback === "wrong") {
      feedback.className = "feedback wrong";
      feedback.innerHTML = `${ICONS.x} ${fact.table} × ${fact.m} = ${fact.answer}`;
      slate.classList.add("wrong");
    } else {
      feedback.className = "feedback";
      feedback.innerHTML = "";
      slate.classList.remove("wrong");
    }

    if (continueRow) continueRow.style.display = t.feedback ? "flex" : "none";
  }

  function renderTabuadaSummary() {
    const t = state.tabuada;
    const perfect = t.misses === 0;
    const color = OPS_META.multiply.color;

    mainEl.innerHTML = `
      <div class="summary-screen">
        <div class="medal ${t.starsEarned === 3 ? "gold" : "try"}">${t.starsEarned === 3 ? ICONS.trophy : ICONS.sprout}</div>
        <h2>${perfect ? "Tabuada dominada!" : "Bom treino!"}</h2>
        <p class="score">
          Tabuada do ${t.table} em ${formatElapsed(t.elapsedMs)}${
      t.misses > 0 ? ` · ${t.misses} ${t.misses === 1 ? "errinho" : "errinhos"}` : ""
    }
        </p>
        ${t.newRecord ? `<p class="summary-note win">🏅 Novo recorde de tempo!</p>` : ""}
        ${!perfect ? `<p class="summary-note">As que você errou vão aparecer mais vezes na próxima — assim gruda de vez!</p>` : ""}
        <div class="btn-row">
          <button class="btn" id="tabuada-again-btn" style="background:${color}">Treinar de novo ${ICONS.retry}</button>
          <button class="btn ghost" id="tabuada-other-btn">Escolher outra tabuada</button>
        </div>
      </div>`;

    document.getElementById("tabuada-again-btn").addEventListener("click", () => beginTabuadaRound(t.table));
    document.getElementById("tabuada-other-btn").addEventListener("click", goToTabuadaSelect);
  }

  render();
</script>

</body>
</html>
